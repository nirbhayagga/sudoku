## Local build (recommended) — clone the repo on the host and:
##   docker compose up -d --build

services:
  sudoku:
    build: .
    container_name: sudoku
    restart: unless-stopped
    depends_on:
      - leaderboard
    environment:
      # Docker's embedded DNS. The leaderboard hostname is resolved per request,
      # so this stack still starts if the leaderboard container is down.
      NGINX_RESOLVER: 127.0.0.11
      LEADERBOARD_UPSTREAM: http://leaderboard:3001
    # ports:
    #   - "8080:80"
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.sudoku.rule=Host(`sudoku.example.com`)"
      - "traefik.http.routers.sudoku.entrypoints=websecure"
      - "traefik.http.routers.sudoku.tls=true"
      - "traefik.http.routers.sudoku.tls.certresolver=letsencrypt"
      - "traefik.http.services.sudoku.loadbalancer.server.port=80"
    networks:
      - traefik

  leaderboard:
    build: ./leaderboard-api
    container_name: sudoku-leaderboard
    restart: unless-stopped
    environment:
      # Restrict to your own domain once the frontend is deployed.
      CORS_ORIGIN: "*"
    volumes:
      - leaderboard-data:/app/data
    networks:
      - traefik

networks:
  traefik:
    external: true

volumes:
  leaderboard-data:
