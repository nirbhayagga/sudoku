services:
  sudoku:
    build:
      context: https://git.example.com/nirb/sudoku.git
    container_name: sudoku
    restart: unless-stopped
    # ports:
    #   - "8080:80"
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.sudoku.rule=Host(`sudoku.example.com`)"
      - "traefik.http.routers.sudoku.entrypoints=websecure"
      - "traefik.http.routers.sudoku.tls=true"
      - "traefik.http.routers.sudoku.tls.certresolver=letsencrypt"
      - "traefik.http.services.sudoku.loadbalancer.server.port=80"
    networks:
      - traefik

  sudoku-api:
    build:
      context: https://git.example.com/nirb/sudoku.git
      dockerfile: backend/Dockerfile
    container_name: sudoku-api
    restart: unless-stopped
    volumes:
      - sudoku_db:/app/data
    networks:
      - traefik

volumes:
  sudoku_db:

networks:
  traefik:
    external: true
