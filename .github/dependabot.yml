# Version-update PRs are disabled; security alerts and security-update PRs use repository settings.
version: 2

updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 0
    groups:
      dev-dependencies:
        patterns: ['*']
        update-types: [minor, patch]
      toolchain-majors:
        patterns: ['vite', 'vitest', '@vitest/*', 'jsdom']
        update-types: [major]
    commit-message:
      prefix: 'deps'

  - package-ecosystem: npm
    directory: /leaderboard-api
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 0
    groups:
      api-dependencies:
        patterns: ['*']
        update-types: [minor, patch]
    commit-message:
      prefix: 'deps(api)'

  - package-ecosystem: docker
    directories:
      - /
      - /leaderboard-api
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 0
    ignore:
      - dependency-name: 'node'
        update-types: ['version-update:semver-major']
    commit-message:
      prefix: 'deps(docker)'

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 0
    groups:
      github-actions:
        patterns: ['*']
    commit-message:
      prefix: 'deps(ci)'
