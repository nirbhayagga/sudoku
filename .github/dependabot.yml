# Opens a PR when a dependency has a new version or a published advisory.
# CI runs on those PRs like any other, so a green check means the suite passed
# against the new version.
version: 2

updates:
  # Frontend dev tooling (vite, vitest, eslint, jsdom).
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      # One PR for routine bumps instead of five.
      dev-dependencies:
        patterns: ['*']
        update-types: [minor, patch]
      # And one for majors, because the test toolchain is peer-locked: vite,
      # vitest and @vitest/coverage-v8 must move together or npm refuses to
      # install. Separate PRs for those can never pass CI individually.
      toolchain-majors:
        patterns: ['vite', 'vitest', '@vitest/*', 'jsdom']
        update-types: [major]
    commit-message:
      prefix: 'deps'

  # The leaderboard API. This one actually ships, so its advisories matter most.
  - package-ecosystem: npm
    directory: /leaderboard-api
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      api-dependencies:
        patterns: ['*']
        update-types: [minor, patch]
    commit-message:
      prefix: 'deps(api)'

  # Base images: node:24-alpine and nginx:alpine.
  #
  # Majors are ignored deliberately. Node's even majors become LTS months after
  # release, so an automatic bump lands you on Current — and it would silently
  # diverge from the node-version pinned in the workflows. Move both together,
  # by hand, when a release reaches LTS.
  - package-ecosystem: docker
    directories:
      - /
      - /leaderboard-api
    schedule:
      interval: weekly
      day: monday
    ignore:
      - dependency-name: 'node'
        update-types: ['version-update:semver-major']
    commit-message:
      prefix: 'deps(docker)'

  # actions/checkout, actions/setup-node and friends. Grouped: they are all
  # first-party and bumping them one PR at a time is pure noise.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      github-actions:
        patterns: ['*']
    commit-message:
      prefix: 'deps(ci)'
