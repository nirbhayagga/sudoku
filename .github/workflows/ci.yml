name: CI

on:
  push:
  pull_request:

# Read-only by default; the publish job widens its own token to push packages.
permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm

      - name: Install frontend dev dependencies
        run: npm ci

      - name: Install leaderboard API dependencies
        run: npm ci --prefix leaderboard-api

      - name: Lint
        run: npm run lint

      # FULL_BANK_CHECK verifies uniqueness for all 5,500 puzzles rather than a
      # sample — a few seconds here, but it catches a bad bank before deploy.
      - name: Test
        run: npm test
        env:
          FULL_BANK_CHECK: '1'

      - name: Build
        run: npm run build

      - name: Upload build output
        uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm

      - run: npm ci

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      # Covers what jsdom cannot: real layout, real touch, and the service
      # worker. Runs against the production build, which the config starts.
      - name: Run end-to-end tests
        run: npm run test:e2e

      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  docker:
    runs-on: ubuntu-latest
    needs: check
    steps:
      - uses: actions/checkout@v7

      - name: Build frontend image
        run: docker build -t sudoku:ci .

      - name: Build leaderboard image
        run: docker build -t sudoku-leaderboard:ci ./leaderboard-api

      # The frontend must come up with no leaderboard present — nginx resolves
      # the upstream per request precisely so this works.
      - name: Frontend starts standalone
        run: |
          docker run -d --name sudoku-ci -p 8080:80 sudoku:ci
          for i in $(seq 1 30); do
            if curl -sf -o /dev/null http://localhost:8080/; then break; fi
            sleep 1
          done
          curl -sf -o /dev/null http://localhost:8080/ || (docker logs sudoku-ci && exit 1)
          test "$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8080/api/health)" = "502"
          docker rm -f sudoku-ci

  # Publishes only from main or a version tag, and only once the tests and the
  # container check above have passed. A pull request builds its images but
  # never pushes them.
  publish:
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    runs-on: ubuntu-latest
    needs: [check, e2e, docker]
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          # Provided automatically; no secret to create or rotate.
          password: ${{ secrets.GITHUB_TOKEN }}

      # A push to main tags latest and the commit SHA: latest is what a server
      # pulls day to day, the SHA is what you pin to when rolling back. A
      # `v1.2.3` tag adds 1.2.3, 1.2 and 1, so a server tracking `:1` picks up
      # fixes without surprises. A pre-release (v1.2.3-rc.1) gets only its own
      # tag — neither latest nor a major ever moves to something unfinished.
      - name: Frontend image tags
        id: frontend
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/sudoku
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,format=long,enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}

      - name: Frontend image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.frontend.outputs.tags }}
          labels: ${{ steps.frontend.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Leaderboard image tags
        id: leaderboard
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/sudoku-leaderboard
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,format=long,enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}

      - name: Leaderboard image
        uses: docker/build-push-action@v6
        with:
          context: ./leaderboard-api
          push: true
          tags: ${{ steps.leaderboard.outputs.tags }}
          labels: ${{ steps.leaderboard.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
