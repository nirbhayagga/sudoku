name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm

      - name: Install frontend dev dependencies
        run: npm ci

      - name: Install leaderboard API dependencies
        run: npm ci --prefix leaderboard-api

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test
        env:
          FULL_BANK_CHECK: '1'

      - name: Build
        run: npm run build

      - name: Upload build output
        uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm

      - run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium webkit

      - name: Run end-to-end tests
        run: npm run test:e2e

      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            test-results/
            playwright-report/
          retention-days: 7

  docker:
    runs-on: ubuntu-latest
    needs: check
    steps:
      - uses: actions/checkout@v7

      - name: Build frontend image
        run: docker build -t sudoku:ci .

      - name: Build leaderboard image
        run: docker build -t sudoku-leaderboard:ci ./leaderboard-api

      - name: Frontend starts standalone
        run: |
          docker run -d --name sudoku-ci -p 8080:80 sudoku:ci
          for i in $(seq 1 30); do
            if curl -sf -o /dev/null http://localhost:8080/; then break; fi
            sleep 1
          done
          curl -sf -o /dev/null http://localhost:8080/ || (docker logs sudoku-ci && exit 1)
          test "$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8080/api/health)" = "502"
          docker rm -f sudoku-ci

      - name: Leaderboard persists scores in a named volume
        shell: bash
        run: |
          set -euo pipefail
          container="sudoku-api-ci-$(date +%s)-$$"
          volume="${container}-data"
          cleanup() {
            status=$?
            if [ "$status" -ne 0 ]; then docker logs "$container" || true; fi
            docker rm -f "$container" >/dev/null 2>&1 || true
            docker volume rm "$volume" >/dev/null 2>&1 || true
            exit "$status"
          }
          trap cleanup EXIT
          docker volume create "$volume"
          start_api() {
            docker run -d --name "$container" \
              --mount "type=volume,source=$volume,target=/app/data" sudoku-leaderboard:ci
            for i in $(seq 1 30); do
              if docker exec "$container" node -e '
                fetch("http://127.0.0.1:3001/api/health", {signal: AbortSignal.timeout(2000)})
                  .then(async r => { if (!r.ok || (await r.json()).status !== "ok") process.exit(1); })
                  .catch(() => process.exit(1));
              '; then return 0; fi
              sleep 1
            done
            return 1
          }
          start_api
          docker exec "$container" node -e '
            const assert = require("node:assert/strict");
            const fs = require("node:fs");
            assert.notEqual(process.getuid(), 0, "API must run unprivileged");
            assert.equal(fs.statSync("/app/data").uid, process.getuid(), "fresh volume ownership");
            (async () => {
              const r = await fetch("http://127.0.0.1:3001/api/leaderboard", {
                signal: AbortSignal.timeout(5000), method: "POST", headers: {"Content-Type": "application/json"},
                body: JSON.stringify({bankVersion: 2, name: "CI smoke", difficulty: "easy", time: 123, hints: 0, level: 1})
              });
              assert.equal(r.ok, true);
              assert.equal((await r.json()).success, true);
              const saved = JSON.parse(fs.readFileSync("/app/data/leaderboard-v2.json", "utf8"));
              assert(saved.easy.some(e => e.name === "CI smoke" && e.time === 123 && e.level === 1));
            })().catch(e => { console.error(e); process.exit(1); });
          '
          docker rm -f "$container"
          start_api
          docker exec "$container" node -e '
            const assert = require("node:assert/strict");
            (async () => {
              const r = await fetch("http://127.0.0.1:3001/api/leaderboard/easy", {signal: AbortSignal.timeout(5000)});
              assert.equal(r.ok, true);
              assert((await r.json()).some(e => e.name === "CI smoke" && e.time === 123 && e.level === 1));
            })().catch(e => { console.error(e); process.exit(1); });
          '

  publish:
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    runs-on: ubuntu-latest
    needs: [check, e2e, docker]
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Frontend image tags
        id: frontend
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/sudoku
          flavor: |
            latest=false
          tags: |
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=sha,format=long,enable=${{ github.ref == 'refs/heads/main' }}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}

      - name: Frontend image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.frontend.outputs.tags }}
          labels: ${{ steps.frontend.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Leaderboard image tags
        id: leaderboard
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/sudoku-leaderboard
          flavor: |
            latest=false
          tags: |
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=sha,format=long,enable=${{ github.ref == 'refs/heads/main' }}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}

      - name: Leaderboard image
        uses: docker/build-push-action@v6
        with:
          context: ./leaderboard-api
          push: true
          tags: ${{ steps.leaderboard.outputs.tags }}
          labels: ${{ steps.leaderboard.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
