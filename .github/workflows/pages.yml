name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - run: npm ci

      # Gate the deploy. Pages publishes straight to the public site, so a
      # broken build would be live until someone noticed.
      - run: npm run lint
      - run: npm test

      # SUDOKU_API_BASE is deliberately left unset by default: a static
      # deployment with no backend simply hides its leaderboard UI, and the
      # alternative is putting an unauthenticated write endpoint on the public
      # internet. Set the repository variable only if that is what you want.
      - run: npm run build
        env:
          SUDOKU_API_BASE: ${{ vars.SUDOKU_API_BASE }}

      # Pages ignores Jekyll for artifact deploys, but _headers begins with an
      # underscore and this removes any doubt.
      - run: touch dist/.nojekyll

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - id: deployment
        uses: actions/deploy-pages@v4
