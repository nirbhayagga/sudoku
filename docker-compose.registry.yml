## Run the published images — no build, no toolchain on the host.
##
##   docker compose -f docker-compose.registry.yml pull
##   docker compose -f docker-compose.registry.yml up -d
##
## Images are published to GHCR by CI on every push to main, tagged `latest`
## and with the commit SHA. Pin to a SHA to roll back:
##   SUDOKU_TAG=<sha> docker compose -f docker-compose.registry.yml up -d
##
## Replaces the old remote-build compose file: pulling a tested image beats
## rebuilding from a git URL on every deploy.

services:
  sudoku:
    image: ghcr.io/${SUDOKU_OWNER:-nirb}/sudoku:${SUDOKU_TAG:-latest}
    container_name: sudoku
    restart: unless-stopped
    depends_on:
      - leaderboard
    environment:
      NGINX_RESOLVER: 127.0.0.11
      LEADERBOARD_UPSTREAM: http://leaderboard:3001
    # ports:
    #   - "8080:80"
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.sudoku.rule=Host(`${SUDOKU_HOST:-sudoku.example.com}`)"
      - "traefik.http.routers.sudoku.entrypoints=websecure"
      - "traefik.http.routers.sudoku.tls=true"
      - "traefik.http.routers.sudoku.tls.certresolver=letsencrypt"
      - "traefik.http.services.sudoku.loadbalancer.server.port=80"
    networks:
      - traefik

  leaderboard:
    image: ghcr.io/${SUDOKU_OWNER:-nirb}/sudoku-leaderboard:${SUDOKU_TAG:-latest}
    container_name: sudoku-leaderboard
    restart: unless-stopped
    environment:
      CORS_ORIGIN: "*"
      # Proxy hops in front of the API (Traefik, then nginx), so rate limiting
      # sees the real client address rather than the proxy's.
      TRUST_PROXY: "2"
    volumes:
      - leaderboard-data:/app/data
    networks:
      - traefik

networks:
  traefik:
    external: true

volumes:
  leaderboard-data:
