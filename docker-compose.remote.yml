## Remote Build (from Git repo)
## Use this if you want to deploy without cloning the repo on the host.
## Deploy: docker compose -f docker-compose.remote.yml up -d --build
## NOTE: All changes must be committed and pushed before rebuilding.

services:
  sudoku:
    build:
      context: https://git.example.com/nirb/sudoku.git
    container_name: sudoku
    restart: unless-stopped
    depends_on:
      - leaderboard
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.sudoku.rule=Host(`sudoku.example.com`)"
      - "traefik.http.routers.sudoku.entrypoints=https"
      - "traefik.http.routers.sudoku.tls=true"
      - "traefik.http.routers.sudoku.tls.certresolver=letsencrypt"
      - "traefik.http.services.sudoku.loadbalancer.server.port=80"
    networks:
      - proxy

  leaderboard:
    build:
      context: https://git.example.com/nirb/sudoku.git#:leaderboard-api
    container_name: sudoku-leaderboard
    restart: unless-stopped
    volumes:
      - leaderboard-data:/app/data
    networks:
      - proxy

networks:
  proxy:
    external: true

volumes:
  leaderboard-data:
