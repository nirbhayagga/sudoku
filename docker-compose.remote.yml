## Remote build (from Git repo) — deploy without cloning on the host.
##   docker compose -f docker-compose.remote.yml up -d --build
## NOTE: all changes must be committed and pushed before rebuilding.

services:
  sudoku:
    build:
      context: https://git.local.nirbslab.com/nirb/sudoku.git
    container_name: sudoku
    restart: unless-stopped
    depends_on:
      - leaderboard
    environment:
      NGINX_RESOLVER: 127.0.0.11
      LEADERBOARD_UPSTREAM: http://leaderboard:3001
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.sudoku.rule=Host(`sudoku.local.nirbslab.com`)"
      - "traefik.http.routers.sudoku.entrypoints=websecure"
      - "traefik.http.routers.sudoku.tls=true"
      - "traefik.http.routers.sudoku.tls.certresolver=letsencrypt"
      - "traefik.http.services.sudoku.loadbalancer.server.port=80"
    networks:
      - traefik

  leaderboard:
    build:
      context: https://git.local.nirbslab.com/nirb/sudoku.git#:leaderboard-api
    container_name: sudoku-leaderboard
    restart: unless-stopped
    volumes:
      - leaderboard-data:/app/data
    networks:
      - traefik

networks:
  traefik:
    external: true

volumes:
  leaderboard-data:
